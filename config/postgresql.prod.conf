# CONNECTIONS
listen_addresses = '100.1.1.20'
port = 5432
max_connections = 80
superuser_reserved_connections = 2
password_encryption = scram-sha-256

# MEMORY (total available ~3.5GB)
shared_buffers = 768MB                 # ~20-22% of available RAM
effective_cache_size = 1.8GB          # planner hint (~50% available)
work_mem = 6MB                         # per-sort memory; higher for single-user analytics; keep moderate for OLTP
maintenance_work_mem = 256MB
temp_buffers = 8MB

# WAL / DURABILITY
wal_level = replica                    # allow logical/physical replication if needed
synchronous_commit = on                # strong data safety; set to remote_write or off only if you accept risk
commit_delay = 0
checkpoint_completion_target = 0.7
max_wal_size = 1GB
min_wal_size = 80MB
wal_buffers = 16MB

# CONCURRENCY & PARALLELISM
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1

# I/O / PLANNER
random_page_cost = 1.5
effective_io_concurrency = 2

# AUTOVACUUM (important for OLTP)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = -1

# LOGGING / MONITORING
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 20MB
log_line_prefix = '%m [%p] %u@%d '
log_min_duration_statement = 2000     # log statements slower than 2s; reduce to 500ms temporarily for profiling
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# TIMEOUTS / SAFETY
statement_timeout = 0                  # disabled by default; set per-app policies
idle_in_transaction_session_timeout = '2min'
lock_timeout = '5s'
deadlock_timeout = '1s'
client_min_messages = notice

# REPLICATION / BACKUP (conservative)
archive_mode = off
max_wal_senders = 2
wal_keep_size = '128MB'

# STATS & MISC
default_statistics_target = 100
track_counts = on
track_io_timing = off

# SECURITY
ssl = off                              # enable and configure if clients traverse untrusted networks
