# CONNECTIONS
listen_addresses = '100.1.1.20'
port = 5432
max_connections = 80
superuser_reserved_connections = 2
password_encryption = scram-sha-256

# MEMORY (total available ~3.5GB)
shared_buffers = 768MB                 # Safe 20-22% allocation
effective_cache_size = 2GB             # Slightly bumped to reflect ~60% of 3.5GB
work_mem = 6MB                         # Safe for 80 connections (Max potential: 480MB)
maintenance_work_mem = 256MB
temp_buffers = 8MB

# WAL / DURABILITY
wal_level = replica
synchronous_commit = on
commit_delay = 0
checkpoint_completion_target = 0.9     # Changed from 0.7 to spread I/O spikes better
max_wal_size = 2GB                     # Increased from 1GB to prevent frequent checkpoints
min_wal_size = 80MB
wal_buffers = 16MB

# CONCURRENCY & PARALLELISM
max_worker_processes = 4               # Matches your 4-core limit assumed by workers
max_parallel_workers = 2
max_parallel_workers_per_gather = 1

# I/O / PLANNER
random_page_cost = 1.1                 # Changed from 1.5 assuming SSD storage
effective_io_concurrency = 200         # Changed from 2 assuming standard SSD storage

# AUTOVACUUM
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.1   # Lowered from 0.2 to trigger vacuum faster on OLTP
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_cost_delay = 2ms     # Lowered from 20ms to make autovacuum run faster
autovacuum_vacuum_cost_limit = 200     # Explicitly set to prevent default fallback issues

# LOGGING / MONITORING
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 20MB
log_line_prefix = '%m [%p] %u@%d '
log_min_duration_statement = 2000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
track_io_timing = on                   # Changed from off for better performance metrics

# TIMEOUTS / SAFETY
statement_timeout = 0
idle_in_transaction_session_timeout = '2min'
lock_timeout = '5s'
deadlock_timeout = '1s'
client_min_messages = notice

# REPLICATION / BACKUP
archive_mode = off
max_wal_senders = 2
wal_keep_size = '128MB'

# STATS & MISC
default_statistics_target = 100
track_counts = on

# SECURITY
ssl = on                               # Changed from off to secure network traffic
